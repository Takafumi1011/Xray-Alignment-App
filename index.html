<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>X-ray Pro V35 - Ultimate Stable</title>
    <style>
        body { margin: 0; font-family: -apple-system, sans-serif; background: #000; color: #fff; overflow: hidden; touch-action: none; }
        #header { position: absolute; top: 0; width: 100%; background: rgba(0,0,0,0.9); z-index: 100; border-bottom: 1px solid #444; }
        .row { display: flex; justify-content: space-around; padding: 6px 0; border-bottom: 1px solid #222; }
        .val { color: #007AFF; font-weight: bold; font-size: 13px; }
        #canvas-container { width: 100vw; height: 100vh; }
        canvas { display: block; }
        .controls { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 10px; }
        button { padding: 12px 18px; border-radius: 8px; border: none; background: #333; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; }
        .primary-btn { background: #007AFF; }
        .excel-btn { background: #217346; }
    </style>
</head>
<body>

<div id="header">
    <div class="row">
        <div>右 HKA: <span id="r-hka" class="val">-</span></div>
        <div>LDFA: <span id="r-ldfa" class="val">-</span></div>
        <div>MPTA: <span id="r-mpta" class="val">-</span></div>
        <div>JLCA: <span id="r-jlca" class="val">-</span></div>
        <div>JLOA: <span id="r-jloa" class="val">-</span></div>
    </div>
    <div class="row">
        <div>左 HKA: <span id="l-hka" class="val">-</span></div>
        <div>LDFA: <span id="l-ldfa" class="val">-</span></div>
        <div>MPTA: <span id="l-mpta" class="val">-</span></div>
        <div>JLCA: <span id="l-jlca" class="val">-</span></div>
        <div>JLOA: <span id="l-jloa" class="val">-</span></div>
    </div>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<div class="controls">
    <input type="file" id="upload" accept="image/*" style="display:none">
    <button class="primary-btn" onclick="document.getElementById('upload').click()">画像読込</button>
    <button class="excel-btn" onclick="copyToExcel()">Excel用コピー</button>
    <button onclick="resetView()">全体表示</button>
</div>

    // 貼り付けイベント
    window.addEventListener('paste', e => {
        const clipboardItems = e.clipboardData.items;
        for (let item of clipboardItems) {
            if (item.type.startsWith('image')) {
                const blob = item.getAsFile();
                const reader = new FileReader();
                reader.onload = f => loadImage(f.target.result);
                reader.readAsDataURL(blob);
            }
        }
    });

    document.getElementById('upload').onchange = e => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = f => loadImage(f.target.result);
            reader.readAsDataURL(file);
        }
    };
