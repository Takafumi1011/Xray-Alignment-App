<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-ray Pro V34 - Mac Optimized</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: #000; color: #fff; overflow: hidden; }
        #header { position: absolute; top: 0; width: 100%; background: rgba(0,0,0,0.9); z-index: 100; border-bottom: 1px solid #444; backdrop-filter: blur(5px); }
        .row { display: flex; justify-content: space-around; padding: 10px 0; border-bottom: 1px solid #222; }
        .val { color: #007AFF; font-weight: bold; font-size: 15px; }
        #canvas-container { width: 100vw; height: 100vh; overflow: hidden; }
        canvas { display: block; touch-action: none; }
        .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 12px; }
        button { padding: 12px 20px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:hover { background: #333; border-color: #777; }
        .primary-btn { background: #007AFF; border: none; }
        .excel-btn { background: #217346; border: none; }
    </style>
</head>
<body>

<div id="header">
    <div class="row">
        <div>右 HKA: <span id="r-hka" class="val">-</span></div>
        <div>LDFA: <span id="r-ldfa" class="val">-</span></div>
        <div>MPTA: <span id="r-mpta" class="val">-</span></div>
        <div>JLCA: <span id="r-jlca" class="val">-</span></div>
        <div>JLOA: <span id="r-jloa" class="val">-</span></div>
    </div>
    <div class="row">
        <div>左 HKA: <span id="l-hka" class="val">-</span></div>
        <div>LDFA: <span id="l-ldfa" class="val">-</span></div>
        <div>MPTA: <span id="l-mpta" class="val">-</span></div>
        <div>JLCA: <span id="l-jlca" class="val">-</span></div>
        <div>JLOA: <span id="l-jloa" class="val">-</span></div>
    </div>
</div>

<div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
</div>

<div class="controls">
    <button class="primary-btn" onclick="document.getElementById('upload').click()">画像選択</button>
    <input type="file" id="upload" accept="image/*" style="display:none">
    <button class="excel-btn" onclick="copyToExcel()">Excel用にコピー</button>
    <button onclick="saveAsCSV()">CSV保存</button>
    <button onclick="resetView()">全体表示</button>
</div>

<script>

    const ctx = canvas.getContext('2d');
    let img = new Image();
    let imgLoaded = false;
    let scale = 1, offsetX = 0, offsetY = 0;
    let points = []; 
    let activePoint = null;
    let isPanning = false;
    let lastMouseX = 0, lastMouseY = 0;
    let dpr = window.devicePixelRatio || 1;

        const w = img.width, h = img.height;
        points = [

            { x: w * 0.35, y: h * 0.15, label: 'RH' }, { x: w * 0.35, y: h * 0.45, label: 'RKf' },

            { x: w * 0.40, y: h * 0.46, label: 'RMF' }, { x: w * 0.30, y: h * 0.46, label: 'RLF' },
            { x: w * 0.40, y: h * 0.47, label: 'RMT' }, { x: w * 0.30, y: h * 0.47, label: 'RLT' },
